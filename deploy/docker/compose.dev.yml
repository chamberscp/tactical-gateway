# Development stack for the Tactical Gateway.
#
# Bring up with:  docker compose -f deploy/docker/compose.dev.yml up -d
# Tear down with: docker compose -f deploy/docker/compose.dev.yml down
#
# All services bind only to localhost by default. Adjust for LAN access
# only deliberately, and never on a network you don't trust.

name: tactical-gateway-dev

services:
  postgres:
    # PostGIS + pgvector in one image. Pin a digest in production.
    image: pgvector/pgvector:pg16
    container_name: tg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gateway
      MINIO_ROOT_PASSWORD: gateway-dev-password
    ports:
      - "127.0.0.1:9000:9000"  # S3 API
      - "127.0.0.1:9001:9001"  # Console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: tg-nats
    restart: unless-stopped
    command:
      - "-js"                    # enable JetStream for durable subjects
      - "-m"
      - "8222"                   # monitoring port
    ports:
      - "127.0.0.1:4222:4222"    # client
      - "127.0.0.1:8222:8222"    # monitoring
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Placeholder gateway service. Real implementation lands in Phase 1.
  # This exists in Phase 0 only to prove the wiring (env vars resolve,
  # DB reachable, NATS reachable, MinIO reachable).
  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    container_name: tg-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: gateway
      MINIO_SECRET_KEY: gateway-dev-password
      MINIO_BUCKET_RAW: raw-captures
      NATS_URL: nats://nats:4222
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"    # HTTP/health/control API
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
  nats-data:

name: tactical-gateway-dev

services:
  postgres:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.postgres
    image: tactical-gateway-postgres:local
    container_name: tg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: tg-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gateway
      MINIO_ROOT_PASSWORD: gateway-dev-password
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: tg-nats
    restart: unless-stopped
    command:
      - "-js"
      - "-m"
      - "8222"
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway
    container_name: tg-gateway
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: gateway
      MINIO_SECRET_KEY: gateway-dev-password
      MINIO_BUCKET_RAW: raw-captures
      NATS_URL: nats://nats:4222
      LOG_LEVEL: INFO
      LOG_JSON: "true"
      COT_XML_TCP_PORT: "8087"
      COT_PB_TCP_PORT: "8089"
      COT_XML_UDP_PORT: "0"
      ROUTES_CONFIG_PATH: /etc/gateway/routes.yaml
    ports:
      - "127.0.0.1:8000:8000"   # HTTP API
      - "127.0.0.1:8087:8087"   # CoT XML TCP
      - "127.0.0.1:8089:8089"   # CoT PB TCP
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  minio-data:
  nats-data:

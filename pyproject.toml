[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tactical-gateway-workspace"
version = "0.2.0"
description = "Tactical data gateway - workspace root"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["**/cotevent_pb2.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["build/", "dist/", ".venv/", "cotevent_pb2.py"]

[[tool.mypy.overrides]]
module = ["minio.*", "nats.*", "geoalchemy2.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "libs/cto_schema/tests",
    "libs/common",
    "services/gateway/tests",
]
asyncio_mode = "auto"
pythonpath = [
    "libs/cto_schema/src",
    "libs/common/src",
    ".",
]

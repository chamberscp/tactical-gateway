[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cto-schema"
version = "0.1.0"
description = "Common Tactical Object schema — canonical normalized data model for the tactical gateway"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cto_schema"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
